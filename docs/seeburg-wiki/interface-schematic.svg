<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1060 560" role="img" aria-label="Wallbox through isolated sensing interface to Pico and Now Playing API">
<style>body{margin:0;padding:24px;background:#faf9f6;color:#252525;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}svg{display:block;width:100%;height:auto;background:white;border:1px solid #ccc;border-radius:8px}.wire{stroke:#334155;stroke-width:3;fill:none}.signal{stroke:#0f766e;stroke-width:3;fill:none}.box{fill:#eef2f7;stroke:#334155;stroke-width:2}.iso{fill:#ecfdf5;stroke:#047857;stroke-width:2}.label{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.note{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#7c2d12}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker></defs>
<path class="wire" marker-end="url(#arrow)" d="M250 210H330"/><path class="wire" marker-end="url(#arrow)" d="M250 350H330"/><path class="signal" marker-end="url(#arrow)" d="M560 280H650"/><path class="signal" marker-end="url(#arrow)" d="M820 280H900"/>
<rect class="box" x="30" y="120" width="220" height="300" rx="12"/><text class="label" x="54" y="165">Seeburg 3W-1</text><text class="label" x="54" y="195">serial 25050</text><text class="label" x="54" y="250">Blue / green / orange</text><text class="label" x="54" y="280">25 VAC system</text><text class="label" x="54" y="335">Motor-driven</text><text class="label" x="54" y="365">selection contacts</text><text class="label" x="54" y="405">pulse groups</text>
<rect class="iso" x="330" y="120" width="230" height="300" rx="12"/><text class="label" x="354" y="165">Isolated input</text><text class="label" x="354" y="195">interface</text><text class="label" x="354" y="250">terminals / breakout</text><text class="label" x="354" y="280">current limiting</text><text class="label" x="354" y="310">one AC optocoupler</text><text class="label" x="354" y="340">3.3 V pull-up</text><text class="label" x="354" y="395">No shared ground</text>
<rect class="box" x="650" y="120" width="170" height="300" rx="12"/><text class="label" x="674" y="175">Pico 2 W</text><text class="label" x="674" y="230">debounce</text><text class="label" x="674" y="260">edge capture</text><text class="label" x="674" y="290">timing decode</text><text class="label" x="674" y="345">emit “B3”</text>
<rect class="box" x="900" y="120" width="130" height="300" rx="12"/><text class="label" x="923" y="175">Now Playing</text><text class="label" x="923" y="205">API</text><text class="label" x="923" y="250">playlist</text><text class="label" x="923" y="280">lookup</text><text class="label" x="923" y="310">HTTP</text><text class="label" x="923" y="365">MPD queue</text>
<text class="note" x="30" y="500">Caution: channel count and resistor values are TBD. Do not connect this to GPIO until measurements and isolation tests are complete.</text>
</svg>
